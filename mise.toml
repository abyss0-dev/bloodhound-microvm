[tools]
go = "1.26.6"
pinact = "4.1.1"

[tasks."actions:pin"]
description = "Pin external Actions and reusable workflows"
run = "pinact run"

[tasks."actions:check"]
description = "Verify Action pins and version comments"
run = "pinact run -check -verify-comment"

[tasks."actions:update"]
description = "Update external Actions and reusable workflows"
run = "pinact run -update"

[tasks.lint]
description = "Check shell syntax and immutable GitHub Action pins"
run = """
for script in scripts/*.sh; do bash -n "$script"; done
scripts/test-readiness.sh
scripts/test-setup.sh
pinact run -fix=false -no-api
"""

[tasks.build]
description = "Build the Bloodhound microVM bundle"
run = "bash scripts/build-bundle.sh"

[tasks.smoke]
description = "Boot the bundle and require Bloodhound readiness"
run = "bash scripts/smoke.sh"
