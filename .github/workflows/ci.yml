name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build and boot Bloodhound microVM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # checkout v7 runs on Node.js 24, the latest LTS line as of 2026-08-21.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true

      - name: Check repository contracts
        run: mise run lint

      - name: Install kernel build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          bc bison build-essential cpio dwarves flex jq libelf-dev libssl-dev
          python3 rsync

      - name: Build bundle
        run: mise run build

      - name: Grant the runner access to KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm

      - name: Boot bundle and verify Bloodhound
        run: mise run smoke
