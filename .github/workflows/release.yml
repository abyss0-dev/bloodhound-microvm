name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version used for a non-publishing distribution dry run
        required: true
        default: v0.0.0-dev

permissions:
  contents: read

jobs:
  build-verify-package:
    name: Build, verify, and package release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - id: auth
        name: Authenticate to Shisho Cloud
        if: ${{ vars.SHISHO_CICD_SENSOR_BOT_ID != '' }}
        uses: flatt-security/shisho-cloud-action@9b68d33503ebf75d7c285d489b288f96ef3df758 # v1
        with:
          bot-id: ${{ vars.SHISHO_CICD_SENSOR_BOT_ID }}
          export-token: true
          expires-in-minutes: 60

      - name: Start ci-cd sensor
        if: ${{ vars.SHISHO_CICD_SENSOR_BOT_ID != '' }}
        uses: cicd-sensor/cicd-sensor-action@a803a7bc1890f85d3f2feb7c29b74b5c730da6c2 # v0.0.37
        with:
          manager-url: https://manager.cicdsensor.cloud.shisho.dev
          manager-token: ${{ steps.auth.outputs.token }}

      # checkout v7 runs on Node.js 24, the latest LTS line as of 2026-08-21.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Takumi Guard for Go modules
        uses: flatt-security/setup-takumi-guard-golang@37631ecffa6faf06754444a4807451b7a55c64b5 # v1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true

      - name: Install kernel build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          bc bison build-essential cpio dwarves flex jq libelf-dev libssl-dev
          python3 rsync zstd

      - name: Check repository contracts
        run: mise run lint

      - name: Build bundle
        run: mise run build

      - name: Grant the runner access to KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm

      - name: Boot bundle and verify Bloodhound
        run: mise run smoke

      - name: Package release
        run: scripts/package-release.sh "${RELEASE_VERSION}"

      - name: Consume and verify packaged release
        run: |
          archive="release/bloodhound-microvm-${RELEASE_VERSION}-x86_64.tar.zst"
          digest="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          BUNDLE_DESTINATION="${RUNNER_TEMP}/consumer-bundle" \
          BUNDLE_SHA256="${digest}" \
          BUNDLE_URL="file://${GITHUB_WORKSPACE}/${archive}" \
          BUNDLE_VERSION="${RELEASE_VERSION}" \
          GITHUB_OUTPUT="${RUNNER_TEMP}/setup-output" \
            setup/setup.sh

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="release/bloodhound-microvm-${RELEASE_VERSION}-x86_64.tar.zst"
          gh release create "${RELEASE_VERSION}" \
            "${archive}" \
            "${archive}.sha256" \
            --generate-notes \
            --title "Bloodhound microVM ${RELEASE_VERSION}" \
            --verify-tag
